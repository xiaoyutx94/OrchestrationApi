<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrchestrationApi - 请求日志</title>

    <!-- Favicon 配置 - 添加版本号防止缓存 -->
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <script src="js/app-shell.js"></script>
    <script>AppShell.earlyAuthCheck();document.documentElement.classList.add("app-pending");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme-config.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <!-- 升级到最新版本的图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/logs.css">

</head>

<body class="app-body">
    <div class="app-shell" x-data="logsManagement()">
        <div id="app-sidebar-root"></div>
        <div class="app-main">
            <header class="app-topbar">
                <div class="app-topbar-left">
                    <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" data-app-action="toggle-sidebar" aria-label="切换侧栏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="app-topbar-titles">
                        <h1 class="app-page-title">请求日志</h1>
                        <p class="app-page-sub">查看和分析 API 请求</p>
                    </div>
                </div>
                <div class="app-topbar-right">
                    <button type="button" class="btn btn-secondary btn-sm" @click="refreshLogs()">刷新</button>
                    <button type="button" class="btn btn-sm" :class="autoRefresh ? 'btn-success' : 'btn-ghost'" @click="toggleAutoRefresh()">
                        <span x-text="autoRefresh ? '自动刷新: 开' : '自动刷新: 关'"></span>
                    </button>
                </div>
            </header>
            <main class="app-content">
                <!-- 实时状态 -->
                <div x-show="autoRefresh" class="log-live-bar mb-3">
                    <span class="log-live-dot"></span>
                    <span>实时更新已启用 · 下次 <b class="tabular-nums" x-text="nextUpdateCountdown"></b>s</span>
                </div>

                <!-- 紧凑指标 -->
                <section class="log-stats mb-3" aria-label="请求统计">
                    <div class="log-stat">
                        <span class="log-stat-label">总请求</span>
                        <span class="log-stat-value tabular-nums" x-text="totalRequests">0</span>
                    </div>
                    <div class="log-stat is-ok">
                        <span class="log-stat-label">成功</span>
                        <span class="log-stat-value tabular-nums" x-text="successRequests">0</span>
                    </div>
                    <div class="log-stat is-bad">
                        <span class="log-stat-label">失败</span>
                        <span class="log-stat-value tabular-nums" x-text="errorRequests">0</span>
                    </div>
                    <div class="log-stat is-info">
                        <span class="log-stat-label">平均耗时</span>
                        <span class="log-stat-value tabular-nums"><span x-text="avgResponseTime">0</span><small>ms</small></span>
                    </div>
                </section>

                <!-- 图表（可折叠） -->
                <section class="log-panel mb-3" id="charts-section">
                    <div class="log-panel-head">
                        <button type="button" class="log-panel-toggle" @click="toggleCharts()">
                            <svg class="log-chevron" :class="{'is-collapsed': chartsCollapsed}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
                            <h2 class="log-panel-title">数据可视化</h2>
                        </button>
                        <div class="log-panel-actions" x-show="!chartsCollapsed">
                            <select x-model="chartTimeRange" @change="updateChartsWithTimeRange()" class="log-select" title="时间范围">
                                <option value="">全部</option>
                                <option value="1h">近1小时</option>
                                <option value="6h">近6小时</option>
                                <option value="24h">近24小时</option>
                                <option value="7d">近7天</option>
                                <option value="30d">近30天</option>
                            </select>
                            <button type="button" @click="exportAllCharts()" class="btn btn-secondary btn-sm">导出</button>
                            <button type="button" @click="resetAllCharts()" class="btn btn-secondary btn-sm">重置缩放</button>
                        </div>
                    </div>
                    <div class="log-panel-body" x-show="!chartsCollapsed">
                        <div class="log-charts-grid">
                            <div class="log-chart-card">
                                <h3 class="log-chart-title">请求状态分布</h3>
                                <div class="chart-container chart-container-sm">
                                    <canvas id="statusChart" role="img" aria-label="请求状态分布饼图"></canvas>
                                </div>
                            </div>
                            <div class="log-chart-card">
                                <h3 class="log-chart-title">模型使用统计</h3>
                                <div class="chart-container chart-container-sm">
                                    <canvas id="modelChart" role="img" aria-label="模型使用统计柱状图"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 筛选 + 列表一体 -->
                <section class="log-panel mb-4">
                    <div class="log-panel-head">
                        <div class="flex items-center gap-2 min-w-0">
                            <h2 class="log-panel-title">请求日志</h2>
                            <span class="log-count tabular-nums" x-text="totalCount + ' 条'"></span>
                            <span x-show="selectedLogs.length > 0" class="log-count is-sel tabular-nums"
                                x-text="'已选 ' + selectedLogs.length"></span>
                        </div>
                        <div class="log-panel-actions">
                            <button type="button" x-show="selectedLogs.length > 0" @click="deleteSelectedLogs()"
                                class="btn btn-danger btn-sm">删除选中</button>
                            <button type="button" @click="exportLogs()" class="btn btn-secondary btn-sm">导出</button>
                            <button type="button" @click="cleanupExpiredLogs()" class="btn btn-secondary btn-sm">清理过期</button>
                            <button type="button" @click="clearErrorLogs()" class="btn btn-secondary btn-sm">清空错误</button>
                            <button type="button" @click="clearAllLogs()" class="btn btn-danger btn-sm">清空全部</button>
                        </div>
                    </div>

                    <div class="log-filter-bar">
                        <select x-model="filters.proxyKeyName" @change="applyFilters()" class="log-select" title="代理密钥">
                            <option value="">所有密钥</option>
                            <template x-for="key in proxyKeys" :key="key">
                                <option :value="key" x-text="key"></option>
                            </template>
                        </select>
                        <select x-model="filters.providerGroup" @change="applyFilters()" class="log-select" title="分组">
                            <option value="">所有分组</option>
                            <template x-for="group in providerGroups" :key="group">
                                <option :value="group" x-text="group"></option>
                            </template>
                        </select>
                        <select x-model="filters.model" @change="applyFilters()" class="log-select" title="模型">
                            <option value="">所有模型</option>
                            <template x-for="model in models" :key="model">
                                <option :value="model" x-text="model"></option>
                            </template>
                        </select>
                        <select x-model="filters.status" @change="applyFilters()" class="log-select" title="状态">
                            <option value="">所有状态</option>
                            <option value="200">成功 200</option>
                            <option value="error">错误</option>
                        </select>
                        <select x-model="filters.stream" @change="applyFilters()" class="log-select" title="请求类型">
                            <option value="">所有类型</option>
                            <option value="true">流式</option>
                            <option value="false">非流式</option>
                        </select>
                    </div>

                    <div class="log-table-wrap">
                        <table class="log-table">
                            <thead>
                                <tr>
                                    <th class="col-check">
                                        <input type="checkbox" @change="toggleSelectAll()" :checked="isAllSelected()" class="log-check" />
                                    </th>
                                    <th>时间</th>
                                    <th>密钥</th>
                                    <th>分组</th>
                                    <th>模型</th>
                                    <th>状态</th>
                                    <th>类型</th>
                                    <th>耗时</th>
                                    <th>IP</th>
                                    <th>错误</th>
                                    <th class="col-act">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="log in logs" :key="log.id">
                                    <tr>
                                        <td class="col-check">
                                            <input type="checkbox" :value="log.id" @change="toggleLogSelection(log.id)"
                                                :checked="selectedLogs.includes(log.id)" class="log-check" />
                                        </td>
                                        <td class="mono nowrap" x-text="formatDate(log.created_at)"></td>
                                        <td class="truncate" :title="log.proxy_key_name" x-text="log.proxy_key_name || '—'"></td>
                                        <td><span class="log-badge log-badge-purple" x-text="log.provider_group || '—'"></span></td>
                                        <td class="mono truncate" :title="log.model" x-text="log.model || '—'"></td>
                                        <td>
                                            <span class="log-badge"
                                                :class="log.status_code === 200 ? 'log-badge-ok' : 'log-badge-bad'"
                                                x-text="log.status_code"></span>
                                        </td>
                                        <td>
                                            <span class="log-badge"
                                                :class="log.is_stream ? 'log-badge-info' : 'log-badge-muted'"
                                                x-text="log.is_stream ? '流式' : '普通'"></span>
                                        </td>
                                        <td class="mono nowrap tabular-nums" x-text="(log.duration || 0) + 'ms'"></td>
                                        <td class="mono truncate" x-text="log.client_ip || '—'"></td>
                                        <td class="err-cell truncate" :title="log.error" x-text="log.error || '—'"></td>
                                        <td class="col-act">
                                            <button type="button" @click="viewLogDetail(log.id)" class="log-link-btn">详情</button>
                                        </td>
                                    </tr>
                                </template>
                                <tr x-show="!logs || logs.length === 0">
                                    <td colspan="11" class="log-empty-cell">暂无请求日志</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="log-pager">
                        <div class="log-pager-info tabular-nums">
                            <span x-text="totalCount ? ((currentPage - 1) * pageSize + 1) : 0"></span>–
                            <span x-text="Math.min(currentPage * pageSize, totalCount)"></span>
                            / <span x-text="totalCount"></span>
                        </div>
                        <div class="log-pager-actions">
                            <button type="button" @click="previousPage()" :disabled="currentPage === 1"
                                class="btn btn-secondary btn-sm">上一页</button>
                            <span class="log-page-num tabular-nums" x-text="currentPage"></span>
                            <button type="button" @click="nextPage()" :disabled="currentPage >= totalPages"
                                class="btn btn-secondary btn-sm">下一页</button>
                        </div>
                    </div>
                </section>

        <!-- Log Detail Modal -->
        <div x-show="showDetailModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
            x-cloak style="display: none;">
            <div class="relative top-10 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white">
                <div class="mt-3">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-900">请求详情</h3>
                        <button @click="showDetailModal = false"
                            class="text-gray-400 hover:text-gray-600 transition-colors duration-150">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div x-show="logDetail" class="space-y-6">
                        <!-- Basic Info -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">请求时间</label>
                                <p class="mt-1 text-sm text-gray-900"
                                    x-text="logDetail ? formatDate(logDetail.created_at) : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">代理密钥</label>
                                <div class="mt-1">
                                    <p class="text-sm font-medium text-gray-900"
                                        x-text="logDetail ? logDetail.proxy_key_name : ''"></p>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">服务商分组</label>
                                <p class="mt-1 text-sm text-gray-900"
                                    x-text="logDetail ? logDetail.provider_group : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">API_KEY</label>
                                <p class="mt-1 text-sm text-gray-900 font-mono break-all"
                                    x-text="logDetail ? logDetail.openrouter_key : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">模型</label>
                                <p class="mt-1 text-sm text-gray-900" x-text="logDetail ? logDetail.model : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">状态码</label>
                                <p class="mt-1 text-sm"
                                    :class="logDetail && logDetail.status_code === 200 ? 'text-green-600' : 'text-red-600'"
                                    x-text="logDetail ? logDetail.status_code : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">请求类型</label>
                                <p class="mt-1 text-sm text-gray-900"
                                    x-text="logDetail ? (logDetail.is_stream ? '流式' : '普通') : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">响应时间</label>
                                <p class="mt-1 text-sm text-gray-900"
                                    x-text="logDetail ? (logDetail.duration || 0) + 'ms' : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">客户端IP</label>
                                <p class="mt-1 text-sm text-gray-900"
                                    x-text="logDetail ? (logDetail.client_ip || '未知') : ''"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">错误信息</label>
                                <p class="mt-1 text-sm text-red-600" x-text="logDetail ? (logDetail.error || '无') : ''">
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Confirm Modal -->
        <div id="confirmModal" class="fixed inset-0 z-50 hidden bg-gray-900/40 p-4">
            <div class="flex min-h-full items-center justify-center">
                <div class="relative w-full max-w-md rounded-xl bg-white p-6 opacity-0 scale-95 transition-all duration-200">
                    <div class="mb-4 flex items-start justify-between">
                        <h3 class="text-lg font-semibold text-gray-900">确认操作</h3>
                        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="document.getElementById('confirmNo').click()">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <p id="confirmMessage" class="mb-6 whitespace-pre-line text-sm text-gray-700">确定要执行此操作吗？</p>
                    <div class="flex justify-end gap-2">
                        <button id="confirmNo" type="button"
                            class="rounded-xl bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200">
                            取消
                        </button>
                        <button id="confirmYes" type="button"
                            class="rounded-xl bg-red-500 px-4 py-2 text-sm font-medium text-white hover:bg-red-600">
                            确认
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alert Modal -->
        <div id="alertModal" class="fixed inset-0 z-50 hidden bg-gray-900/40 p-4">
            <div class="flex min-h-full items-center justify-center">
                <div class="relative w-full max-w-md rounded-xl bg-white p-6 opacity-0 scale-95 transition-all duration-200">
                    <div class="mb-4 flex items-start justify-between">
                        <h3 id="alertTitle" class="text-lg font-semibold text-gray-900">提示</h3>
                        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="document.getElementById('alertOk').click()">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="mb-6 flex items-start gap-3">
                        <div id="alertIcon"></div>
                        <p id="alertMessage" class="whitespace-pre-line text-sm text-gray-700">操作完成</p>
                    </div>
                    <div class="flex justify-end">
                        <button id="alertOk" type="button"
                            class="rounded-xl bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600">
                            确定
                        </button>
                    </div>
                </div>
            </div>
        </div>

            </main>
        </div>
    </div><!-- /.app-shell -->

    <script src="js/logs.js"></script>
    <script>AppShell.init("logs");</script>
</body>

</html>
