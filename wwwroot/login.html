<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrchestrationApi - 登录</title>
    
    <!-- Favicon 配置 - 添加版本号防止缓存 -->
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="app-body login-body">
    <div class="login-shell">
    <div class="login-card">
    <div class="max-w-md w-full">
        <!-- Logo 区域 -->
        <div class="text-center mb-8">
            <div class="login-mark" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>
            </div>
            <h1 class="login-title">OrchestrationApi</h1>
            <p class="login-sub">多服务商 AI API 编排控制台</p>
        </div>

        <!-- 登录表单 -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl shadow-gray-200/50 p-8 border border-white/50 relative overflow-hidden">
            <!-- decorative background blob -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
            
            <form id="loginForm" class="relative z-10">
                <div class="mb-6">
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                        用户名
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400 group-focus-within:text-primary-500 transition-colors"></i>
                        </div>
                        <input type="text" id="username" name="username" required
                            class="w-full pl-11 pr-4 py-3.5 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all duration-200 outline-none text-gray-800 placeholder-gray-400"
                            placeholder="请输入用户名">
                    </div>
                </div>

                <div class="mb-8">
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                        密码
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 group-focus-within:text-primary-500 transition-colors"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="w-full pl-11 pr-12 py-3.5 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all duration-200 outline-none text-gray-800 placeholder-gray-400"
                            placeholder="请输入密码">
                        <button type="button" id="togglePassword" 
                            class="absolute right-0 top-0 h-full px-4 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="hidden mb-6 p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl text-sm flex items-start">
                    <i class="fas fa-exclamation-circle mt-0.5 mr-2 flex-shrink-0"></i>
                    <span id="errorText"></span>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" id="loginButton"
                    class="w-full bg-primary-600 text-white py-3.5 px-4 rounded-xl font-semibold shadow-lg shadow-primary-500/30 hover:bg-primary-700 hover:shadow-primary-600/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none">
                    <span id="loginButtonText" class="flex items-center justify-center">
                        登录 <i class="fas fa-arrow-right ml-2 text-sm opacity-80"></i>
                    </span>
                    <span id="loginButtonLoading" class="hidden flex items-center justify-center">
                        <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        登录中...
                    </span>
                </button>
            </form>
        </div>

        <!-- 页脚信息 -->
        <div class="text-center mt-8 text-gray-500 text-sm">
            <p>&copy; 2025 OrchestrationApi. All rights reserved.</p>
        </div>
    </div>
    </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
