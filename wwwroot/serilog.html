<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrchestrationApi - 系统日志</title>

    <!-- Favicon 配置 - 添加版本号防止缓存 -->
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <script src="js/app-shell.js"></script>
    <script>AppShell.earlyAuthCheck();document.documentElement.classList.add("app-pending");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme-config.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/logs.css">

</head>

<body class="app-body">
    <div class="app-shell" x-data="serilogManagement()">
        <div id="app-sidebar-root"></div>
        <div class="app-main">
            <header class="app-topbar">
                <div class="app-topbar-left">
                    <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" data-app-action="toggle-sidebar" aria-label="切换侧栏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="app-topbar-titles">
                        <h1 class="app-page-title">系统日志</h1>
                        <p class="app-page-sub">Serilog 运行时诊断</p>
                    </div>
                </div>
                <div class="app-topbar-right">
                    <button type="button" class="btn btn-sm" :class="autoRefresh ? 'btn-success' : 'btn-ghost'" @click="toggleAutoRefresh()">
                        <span x-text="autoRefresh ? '自动刷新: 开' : '自动刷新: 关'"></span>
                    </button>
                </div>
            </header>
            <main class="app-content">
                <!-- 紧凑指标 -->
                <section class="log-stats mb-3" aria-label="系统日志统计">
                    <div class="log-stat">
                        <span class="log-stat-label">总日志</span>
                        <span class="log-stat-value tabular-nums" x-text="statistics.totalLogs">0</span>
                    </div>
                    <div class="log-stat is-ok">
                        <span class="log-stat-label">近24小时</span>
                        <span class="log-stat-value tabular-nums" x-text="statistics.last24Hours">0</span>
                    </div>
                    <div class="log-stat is-info">
                        <span class="log-stat-label">近1小时</span>
                        <span class="log-stat-value tabular-nums" x-text="statistics.lastHour">0</span>
                    </div>
                    <div class="log-stat is-purple">
                        <span class="log-stat-label">库大小</span>
                        <span class="log-stat-value tabular-nums" x-text="formatBytes(statistics.databaseSize)">0</span>
                    </div>
                </section>

                <!-- 级别分布图表（可折叠） -->
                <section class="log-panel mb-3">
                    <div class="log-panel-head">
                        <button type="button" class="log-panel-toggle" @click="toggleCharts()">
                            <svg class="log-chevron" :class="{'is-collapsed': chartsCollapsed}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
                            <h2 class="log-panel-title">级别分布</h2>
                        </button>
                    </div>
                    <div class="log-panel-body" x-show="!chartsCollapsed">
                        <div class="log-charts-grid" x-show="Object.keys(statistics.logsByLevel || {}).length > 0">
                            <div class="log-chart-card">
                                <h3 class="log-chart-title">级别占比</h3>
                                <div class="chart-container chart-container-sm">
                                    <canvas id="levelPieChart"></canvas>
                                </div>
                            </div>
                            <div class="log-chart-card">
                                <h3 class="log-chart-title">级别数量</h3>
                                <div class="chart-container chart-container-sm">
                                    <canvas id="levelBarChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div x-show="Object.keys(statistics.logsByLevel || {}).length === 0" class="log-empty-inline">
                            暂无级别统计数据
                        </div>
                    </div>
                </section>

                <!-- 筛选 + 列表 -->
                <section class="log-panel mb-4">
                    <div class="log-panel-head">
                        <div class="flex items-center gap-2 min-w-0">
                            <h2 class="log-panel-title">系统日志</h2>
                            <span class="log-count tabular-nums" x-text="totalLogs + ' 条'"></span>
                        </div>
                        <div class="log-panel-actions">
                            <button type="button" @click="showCleanupModal = true" class="btn btn-danger btn-sm">清理旧日志</button>
                        </div>
                    </div>

                    <div class="log-filter-bar">
                        <select x-model="filters.level" class="log-select" title="日志级别">
                            <option value="">全部级别</option>
                            <template x-for="level in levels" :key="level">
                                <option :value="level" x-text="level"></option>
                            </template>
                        </select>
                        <div class="log-search-field">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" x-model="filters.keyword" placeholder="搜索消息或异常…"
                                @keyup.enter="applyFilters()" class="log-input" />
                        </div>
                        <input type="datetime-local" x-model="filters.startTime" class="log-input" title="开始时间" />
                        <input type="datetime-local" x-model="filters.endTime" class="log-input" title="结束时间" />
                        <button type="button" @click="applyFilters()" class="btn btn-primary btn-sm">筛选</button>
                        <button type="button" @click="resetFilters()" class="btn btn-secondary btn-sm">重置</button>
                    </div>

                    <div x-show="loading" class="log-loading">
                        <svg class="animate-spin" width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span>加载中…</span>
                    </div>

                    <div x-show="!loading" class="log-table-wrap">
                        <table class="log-table">
                            <thead>
                                <tr>
                                    <th class="col-id">ID</th>
                                    <th class="col-time">时间</th>
                                    <th class="col-level">级别</th>
                                    <th>消息</th>
                                    <th class="col-act">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-if="logs.length === 0">
                                    <tr>
                                        <td colspan="5" class="log-empty-cell">暂无日志数据</td>
                                    </tr>
                                </template>
                                <template x-for="log in logs" :key="log.id">
                                    <tr>
                                        <td class="col-id mono tabular-nums" x-text="log.id"></td>
                                        <td class="col-time mono nowrap" x-text="formatDateTime(log.timestamp)"></td>
                                        <td class="col-level">
                                            <span class="log-badge" :class="getLevelBadgeClass(log.level)"
                                                x-text="log.level || 'Unknown'"></span>
                                        </td>
                                        <td class="msg-cell truncate" x-text="log.message || '—'" :title="log.message"></td>
                                        <td class="col-act">
                                            <button type="button" @click="showLogDetail(log)" class="log-link-btn">详情</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <div class="log-pager">
                        <div class="log-pager-info tabular-nums">
                            <span x-text="totalLogs ? ((currentPage - 1) * pageSize + 1) : 0"></span>–
                            <span x-text="Math.min(currentPage * pageSize, totalLogs)"></span>
                            / <span x-text="totalLogs"></span>
                        </div>
                        <div class="log-pager-actions">
                            <button type="button" @click="goToPage(currentPage - 1)" :disabled="currentPage === 1"
                                class="btn btn-secondary btn-sm">上一页</button>
                            <span class="log-page-num tabular-nums" x-text="currentPage"></span>
                            <button type="button" @click="goToPage(currentPage + 1)" :disabled="currentPage >= totalPages"
                                class="btn btn-secondary btn-sm">下一页</button>
                        </div>
                    </div>
                </section>

        <!-- Log Detail Modal -->
        <div x-show="showDetailModal" x-cloak @click.away="showDetailModal = false"
            class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
            <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">日志详情</h3>
                    <button @click="showDetailModal = false" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="space-y-4" x-show="selectedLog">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ID</label>
                        <div class="mt-1 p-2 bg-gray-50 rounded" x-text="selectedLog?.id"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">时间</label>
                        <div class="mt-1 p-2 bg-gray-50 rounded" x-text="formatDateTime(selectedLog?.timestamp)"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">级别</label>
                        <div class="mt-1">
                            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                :class="getLevelBadgeClass(selectedLog?.level)"
                                x-text="selectedLog?.level || 'Unknown'"></span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">消息</label>
                        <div class="mt-1 p-2 bg-gray-50 rounded whitespace-pre-wrap font-mono text-sm"
                            x-text="selectedLog?.message || '-'"></div>
                    </div>
                    <div x-show="selectedLog?.exception">
                        <label class="block text-sm font-medium text-gray-700">异常</label>
                        <div class="mt-1 p-2 bg-red-50 rounded whitespace-pre-wrap font-mono text-sm max-h-64 overflow-y-auto"
                            x-text="selectedLog?.exception"></div>
                    </div>
                    <div x-show="selectedLog?.properties">
                        <label class="block text-sm font-medium text-gray-700">属性</label>
                        <div class="mt-1 p-2 bg-gray-50 rounded whitespace-pre-wrap font-mono text-sm max-h-64 overflow-y-auto"
                            x-text="selectedLog?.properties"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cleanup Modal -->
        <div x-show="showCleanupModal" x-cloak @click.away="showCleanupModal = false"
            class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">清理旧日志</h3>
                    <button @click="showCleanupModal = false" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">删除多少天之前的日志？</label>
                    <input type="number" x-model="cleanupDays" min="1" max="365"
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="mt-2 text-sm text-red-600">⚠️ 此操作不可恢复，请谨慎操作！</p>
                </div>
                <div class="flex gap-2 justify-end">
                    <button @click="showCleanupModal = false"
                        class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-xl transition duration-200">
                        取消
                    </button>
                    <button @click="cleanupOldLogs()"
                        class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl transition duration-200">
                        确认删除
                    </button>
                </div>
            </div>
        </div>

            </main>
        </div>
    </div><!-- /.app-shell -->

    <script src="js/serilog.js"></script>
    <script>AppShell.init("serilog");</script>
</body>

</html>
