<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrchestrationApi - 健康检查报表</title>

    <!-- Favicon 配置 -->
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <script src="js/app-shell.js"></script>
    <script>AppShell.earlyAuthCheck();document.documentElement.classList.add("app-pending");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme-config.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/logs.css">
    <link rel="stylesheet" href="css/modal-components.css">
</head>

<body class="app-body">
    <div class="app-shell" x-data="healthReportDashboard()">
        <div id="app-sidebar-root"></div>
        <div class="app-main">
            <header class="app-topbar">
                <div class="app-topbar-left">
                    <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" data-app-action="toggle-sidebar" aria-label="切换侧栏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="app-topbar-titles">
                        <h1 class="app-page-title">健康检查报表</h1>
                        <p class="app-page-sub">监控服务商、密钥与模型健康状态</p>
                    </div>
                </div>
                <div class="app-topbar-right">
                    <button type="button" class="btn btn-primary btn-sm" @click="triggerHealthCheck()" :disabled="triggeringCheck">
                        <span x-show="!triggeringCheck">手动检查</span>
                        <span x-show="triggeringCheck">检查中...</span>
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" @click="refreshAllData()" :disabled="loading">
                        <span x-show="!loading">刷新</span>
                        <span x-show="loading">加载中...</span>
                    </button>
                </div>
            </header>
            <main class="app-content">
                <!-- 紧凑概览 -->
                <section class="log-stats mb-3" aria-label="健康概览">
                    <div class="log-stat is-ok">
                        <span class="log-stat-label">健康服务商</span>
                        <span class="log-stat-value tabular-nums" x-text="overview.healthy_providers || 0">0</span>
                    </div>
                    <div class="log-stat is-info">
                        <span class="log-stat-label">健康密钥</span>
                        <span class="log-stat-value tabular-nums" x-text="overview.healthy_keys || 0">0</span>
                    </div>
                    <div class="log-stat is-purple">
                        <span class="log-stat-label">健康模型</span>
                        <span class="log-stat-value tabular-nums" x-text="overview.healthy_models || 0">0</span>
                    </div>
                    <div class="log-stat">
                        <span class="log-stat-label">整体成功率</span>
                        <span class="log-stat-value tabular-nums"
                            x-text="(overview.overall_success_rate || 0).toFixed(1) + '%'">0%</span>
                    </div>
                </section>

                <!-- 服务商健康列表 -->
                <section class="log-panel mb-4">
                    <div class="log-panel-head">
                        <div class="flex flex-wrap items-center gap-2 min-w-0">
                            <h2 class="log-panel-title">服务商健康状态</h2>
                            <span class="log-count tabular-nums" x-text="(reportData?.length || 0) + ' 组'"></span>
                            <div class="hr-legend" x-data="{ tip: null }">
                                <span class="hr-legend-item" title="连续失败 0 次且至少成功 1 次">
                                    <i class="hr-dot is-ok"></i>健康
                                </span>
                                <span class="hr-legend-item" title="连续失败 1–2 次，间歇性问题">
                                    <i class="hr-dot is-warn"></i>警告
                                </span>
                                <span class="hr-legend-item" title="连续失败 ≥3 次，服务不可用">
                                    <i class="hr-dot is-bad"></i>异常
                                </span>
                                <span class="hr-legend-item" title="尚未检查或数据不完整">
                                    <i class="hr-dot is-unk"></i>未知
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="log-table-wrap">
                        <table class="log-table hr-table">
                            <thead>
                                <tr>
                                    <th>服务商</th>
                                    <th>服务商状态</th>
                                    <th>密钥</th>
                                    <th>模型</th>
                                    <th>最后检查</th>
                                    <th class="col-act-wide">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="group in reportData" :key="group.group_id">
                                    <tr>
                                        <td>
                                            <div class="hr-name" x-text="group.group_name"></div>
                                            <div class="hr-sub mono" x-text="group.provider_type"></div>
                                        </td>
                                        <td>
                                            <span class="log-badge" :class="getStatusClass(group.provider_health.status)"
                                                x-text="getStatusText(group.provider_health.status)"></span>
                                            <div class="hr-sub mono tabular-nums"
                                                x-text="Math.round(group.provider_health.avg_response_time || 0) + 'ms'"></div>
                                        </td>
                                        <td>
                                            <div class="hr-ratio">
                                                <span class="is-ok tabular-nums" x-text="group.keys_health.healthy_keys"></span>
                                                <span class="sep">/</span>
                                                <span class="tabular-nums" x-text="group.keys_health.total_keys"></span>
                                            </div>
                                            <div class="hr-sub tabular-nums"
                                                x-text="(group.keys_health.avg_success_rate || 0).toFixed(1) + '%'"></div>
                                        </td>
                                        <td>
                                            <div class="hr-ratio">
                                                <span class="is-ok tabular-nums" x-text="group.models_health.healthy_models"></span>
                                                <span class="sep">/</span>
                                                <span class="tabular-nums" x-text="group.models_health.total_models"></span>
                                            </div>
                                            <div class="hr-sub tabular-nums"
                                                x-text="(group.models_health.avg_success_rate || 0).toFixed(1) + '%'"></div>
                                        </td>
                                        <td class="mono nowrap hr-sub"
                                            x-text="formatDateTime(group.provider_health.last_check)"></td>
                                        <td class="col-act-wide">
                                            <div class="hr-actions">
                                                <button type="button" @click="triggerGroupHealthCheck(group.group_id)"
                                                    :disabled="isGroupCheckInProgress(group.group_id)"
                                                    class="log-link-btn" title="检查此分组">
                                                    <span x-show="!isGroupCheckInProgress(group.group_id)">检查</span>
                                                    <span x-show="isGroupCheckInProgress(group.group_id)">…</span>
                                                </button>
                                                <button type="button" @click="viewGroupDetails(group.group_id)"
                                                    class="log-link-btn">详情</button>
                                                <button type="button" @click="toggleGroupStatus(group.group_id, group.enabled)"
                                                    class="log-link-btn"
                                                    :class="group.enabled ? 'is-warn' : 'is-ok'"
                                                    x-text="group.enabled ? '禁用' : '启用'"></button>
                                                <button type="button" @click="deleteGroup(group.group_id)"
                                                    class="log-link-btn is-bad">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <tr x-show="reportData.length === 0 && !loading">
                                    <td colspan="6" class="log-empty-cell">
                                        暂无健康检查数据，请先配置服务商并触发检查
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 分组详情弹窗 -->
                <div x-show="showGroupDetails" x-cloak class="gf-overlay" style="display:none"
                    @keydown.escape.window="showGroupDetails = false">
                    <div class="gf-modal hr-detail-modal" @click.stop role="dialog" aria-modal="true">
                        <header class="gf-header">
                            <div class="min-w-0">
                                <h3 class="gf-title">
                                    服务商详情
                                    <span class="gf-id-tag" x-text="selectedGroup?.group_name || ''"></span>
                                </h3>
                                <p class="gf-sub">
                                    <span x-text="selectedGroup?.provider_type || ''"></span>
                                    <span class="dash-sep">·</span>
                                    <span class="log-badge" :class="getStatusClass(selectedGroup?.provider_health?.status)"
                                        x-text="getStatusText(selectedGroup?.provider_health?.status)"></span>
                                    <span class="dash-sep">·</span>
                                    <span x-text="'检查 ' + formatDateTime(selectedGroup?.provider_health?.last_check)"></span>
                                </p>
                            </div>
                            <button type="button" @click="showGroupDetails = false" class="gf-close" aria-label="关闭">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </header>

                        <div class="gf-body">
                            <div x-show="selectedGroup?.provider_health?.error_message" class="hr-error-banner mb-3">
                                <strong>错误</strong>
                                <span x-text="selectedGroup?.provider_health?.error_message"></span>
                            </div>

                            <!-- 密钥 -->
                            <div class="mb-4" x-show="selectedGroup?.keys && selectedGroup.keys.length > 0">
                                <div class="gf-toolbar">
                                    <span class="gf-section-title">密钥状态</span>
                                    <span class="gf-muted tabular-nums"
                                        x-text="(selectedGroup?.keys_health?.healthy_keys || 0) + ' / ' + (selectedGroup?.keys_health?.total_keys || 0) + ' 健康'"></span>
                                </div>
                                <div class="log-table-wrap hr-inner-table">
                                    <table class="log-table">
                                        <thead>
                                            <tr>
                                                <th>密钥</th>
                                                <th>状态</th>
                                                <th>成功率</th>
                                                <th>耗时</th>
                                                <th>最后检查</th>
                                                <th>错误</th>
                                                <th class="col-act">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="key in selectedGroup?.keys || []" :key="key.key_id">
                                                <tr>
                                                    <td class="mono truncate" :title="key.masked_key || key.api_key"
                                                        x-text="key.masked_key || (key.api_key ? key.api_key.substring(0, 20) + '…' : '—')"></td>
                                                    <td><span class="log-badge" :class="getStatusClass(key.health_status)"
                                                        x-text="getStatusText(key.health_status)"></span></td>
                                                    <td class="mono tabular-nums" x-text="(key.success_rate || 0).toFixed(1) + '%'"></td>
                                                    <td class="mono tabular-nums" x-text="Math.round(key.avg_response_time || 0) + 'ms'"></td>
                                                    <td class="mono nowrap hr-sub" x-text="formatDateTime(key.last_check)"></td>
                                                    <td class="err-cell truncate" :title="key.error_message || ''"
                                                        x-text="key.error_message || '—'"></td>
                                                    <td class="col-act">
                                                        <button type="button"
                                                            @click="deleteApiKey(selectedGroupId, key.api_key || key.masked_key)"
                                                            class="log-link-btn is-bad">删除</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- 模型 -->
                            <div class="mb-4" x-show="selectedGroup?.models && selectedGroup.models.length > 0">
                                <div class="gf-toolbar">
                                    <span class="gf-section-title">模型状态</span>
                                    <span class="gf-muted tabular-nums"
                                        x-text="(selectedGroup?.models_health?.healthy_models || 0) + ' / ' + (selectedGroup?.models_health?.total_models || 0) + ' 健康'"></span>
                                </div>
                                <div class="log-table-wrap hr-inner-table">
                                    <table class="log-table">
                                        <thead>
                                            <tr>
                                                <th>模型</th>
                                                <th>状态</th>
                                                <th>成功率</th>
                                                <th>耗时</th>
                                                <th>最后检查</th>
                                                <th>错误</th>
                                                <th class="col-act">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="model in selectedGroup?.models || []" :key="model.model_name">
                                                <tr>
                                                    <td class="mono truncate" :title="model.model_name" x-text="model.model_name"></td>
                                                    <td><span class="log-badge" :class="getStatusClass(model.health_status)"
                                                        x-text="getStatusText(model.health_status)"></span></td>
                                                    <td class="mono tabular-nums" x-text="(model.success_rate || 0).toFixed(1) + '%'"></td>
                                                    <td class="mono tabular-nums" x-text="Math.round(model.avg_response_time || 0) + 'ms'"></td>
                                                    <td class="mono nowrap hr-sub" x-text="formatDateTime(model.last_check)"></td>
                                                    <td class="err-cell truncate" :title="model.error_message || ''"
                                                        x-text="model.error_message || '—'"></td>
                                                    <td class="col-act">
                                                        <button type="button"
                                                            @click="deleteModel(selectedGroupId, model.model_name)"
                                                            class="log-link-btn is-bad">删除</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- 历史 -->
                            <div x-show="selectedGroup?.recent_checks && selectedGroup.recent_checks.length > 0">
                                <div class="gf-toolbar">
                                    <span class="gf-section-title">最近检查历史</span>
                                </div>
                                <div class="log-table-wrap hr-inner-table">
                                    <table class="log-table">
                                        <thead>
                                            <tr>
                                                <th>时间</th>
                                                <th>类型</th>
                                                <th>状态</th>
                                                <th>耗时</th>
                                                <th>错误</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="check in selectedGroup?.recent_checks || []" :key="check.id">
                                                <tr>
                                                    <td class="mono nowrap" x-text="formatDateTime(check.checked_at)"></td>
                                                    <td x-text="check.check_type"></td>
                                                    <td>
                                                        <span class="log-badge"
                                                            :class="check.is_success ? 'log-badge-ok' : 'log-badge-bad'"
                                                            x-text="check.is_success ? '成功' : '失败'"></span>
                                                    </td>
                                                    <td class="mono tabular-nums" x-text="Math.round(check.response_time || 0) + 'ms'"></td>
                                                    <td class="err-cell truncate" :title="check.error_message || ''"
                                                        x-text="check.error_message || '—'"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <footer class="gf-footer">
                            <div class="gf-footer-hint">密钥 / 模型 / 历史检查明细</div>
                            <div class="gf-footer-actions">
                                <button type="button" @click="showGroupDetails = false" class="btn btn-secondary btn-sm">关闭</button>
                            </div>
                        </footer>
                    </div>
                </div>

                <!-- 加载遮罩 -->
                <div x-show="loading" class="hr-loading-mask" style="display:none">
                    <div class="hr-loading-card">
                        <svg class="animate-spin" width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span>加载健康检查数据…</span>
                    </div>
                </div>

        <!-- 确认提示框模态框 -->
        <div id="confirmModal" class="modal-overlay fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
            <div class="relative min-h-screen flex items-center justify-center p-4">
                <div class="modal-content relative bg-white/80 backdrop-blur-md rounded-2xl shadow-soft border border-white/50-xl max-w-md w-full mx-auto transform transition-all duration-300">
                    <!-- 模态框头部 -->
                    <div class="flex items-center justify-between p-6 border-b border-gray-200 modal-border">
                        <h3 class="text-lg font-medium text-gray-900">确认操作</h3>
                        <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors" aria-label="关闭">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- 模态框内容 -->
                    <div class="p-6">
                        <div class="flex items-center mb-4">
                            <div class="modal-icon bg-yellow-100 rounded-full p-3 mr-4">
                                <svg class="h-6 w-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16c-.77.833.192 2.5 1.732 2.5z">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <p id="confirmMessage" class="text-gray-700 modal-text-secondary text-base leading-relaxed">确定要执行此操作吗？</p>
                            </div>
                        </div>
                    </div>

                    <!-- 模态框底部 -->
                    <div class="px-6 py-4 border-t border-gray-200 modal-border flex justify-end space-x-3 modal-buttons">
                        <button id="confirmNo"
                                class="modal-button cancel-button px-4 py-2 text-white rounded-md text-base font-medium focus:outline-none focus:ring-2 focus:ring-gray-300">
                            取消
                        </button>
                        <button id="confirmYes"
                                class="modal-button confirm-button px-4 py-2 text-white rounded-md text-base font-medium focus:outline-none focus:ring-2 focus:ring-red-300">
                            确认
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息提示框模态框 -->
        <div id="alertModal" class="modal-overlay fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
            <div class="relative min-h-screen flex items-center justify-center p-4">
                <div class="modal-content relative bg-white/80 backdrop-blur-md rounded-2xl shadow-soft border border-white/50-xl max-w-md w-full mx-auto transform transition-all duration-300">
                    <!-- 模态框头部 -->
                    <div class="flex items-center justify-between p-6 border-b border-gray-200 modal-border">
                        <h3 id="alertTitle" class="text-lg font-medium text-gray-900">提示</h3>
                        <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors" aria-label="关闭">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- 模态框内容 -->
                    <div class="p-6">
                        <div class="flex items-center mb-4">
                            <div id="alertIcon" class="modal-icon mr-4">
                                <!-- 图标将通过JavaScript动态设置 -->
                            </div>
                            <div>
                                <p id="alertMessage" class="text-gray-700 modal-text-secondary text-base leading-relaxed">这是一条提示消息</p>
                            </div>
                        </div>
                    </div>

                    <!-- 模态框底部 -->
                    <div class="px-6 py-4 border-t border-gray-200 modal-border flex justify-end modal-buttons">
                        <button id="alertOk"
                                class="modal-button px-4 py-2 text-white text-base font-medium rounded-md w-20 focus:outline-none transition-colors bg-blue-500 hover:bg-blue-600 focus:ring-blue-300">
                            确定
                        </button>
                    </div>
                </div>
            </div>
        </div>

    <!-- 引入模态框组件 -->

            </main>
        </div>
    </div><!-- /.app-shell -->

    <script src="js/modal-components.js"></script>
    <script src="js/health-report.js"></script>
    <script>AppShell.init("health-report");</script>
</body>

</html>
